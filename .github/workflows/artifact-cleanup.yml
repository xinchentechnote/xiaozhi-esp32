# fork 自上游的构建工作流不便改动（同步会冲突）；本工作流独立清理构建产物。
# 动机：本仓库 CI 每次推送产出 ~16 个板型固件（~3MB/个），默认 90 天保留
# 曾累积 262MB——而 free 层账户的 Actions 存储配额是全账户共 500MB，
# 超限后名下所有仓库的产物上传都会被拒。
name: artifact-cleanup

on:
  schedule:
    - cron: '17 21 * * *' # 每日 UTC 21:17（错开整点高峰）
  workflow_dispatch: {} # 支持手动触发：Actions 页 → artifact-cleanup → Run

permissions:
  actions: write # 删除产物所需

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 3 * 24 * 60 * 60 * 1000; // 3 天前的产物
            for await (const page of github.paginate.iterator(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            )) {
              for (const a of page.data) {
                if (!a.expired && new Date(a.created_at).getTime() < cutoff) {
                  core.info(`deleting ${a.name} (id=${a.id}, created=${a.created_at})`);
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: a.id,
                  });
                }
              }
            }
            core.info('cleanup done');
